<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="이름을 입력하고 따뜻한 인사말을 받아 보세요." />
    <title>반가워요!</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="greeting-card">
      <div class="sparkle" aria-hidden="true">✦</div>
      <p class="eyebrow">작은 인사 한마디</p>
      <h1>오늘도 반가워요!</h1>
      <p class="description">이름을 알려 주시면 반갑게 인사할게요.</p>

      <form id="greeting-form">
        <label for="name-input">이름</label>
        <div class="input-row">
          <input
            id="name-input"
            name="name"
            type="text"
            placeholder="예: 민지"
            autocomplete="given-name"
            maxlength="40"
            required
          />
          <button type="submit">인사하기</button>
        </div>
      </form>

      <p id="greeting-message" class="greeting-message" aria-live="polite"></p>
      <p id="input-hint" class="input-hint">이름을 입력하고 버튼을 눌러 보세요.</p>
    </main>
  </body>
</html>
